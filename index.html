<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>SuperChef Challenge — Live Scoring</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --red:#EE3524; --red-deep:#C42A1C; --amber:#F7A81B; --amber-soft:#FFCF6B;
  --maroon:#5E1622; --cream:#FFF6E9; --ink:#2A130F; --ink-soft:#8A6F63;
  --green:#1F9E6A; --green-deep:#177C53; --green-tint:#E4F4EC;
  --line:#EEE0CA; --line-strong:#E0CBA9; --card:#FFFFFF;
  --shadow:0 2px 4px rgba(94,22,34,.05), 0 12px 30px rgba(94,22,34,.08);
  --shadow-lg:0 8px 20px rgba(94,22,34,.10), 0 24px 60px rgba(94,22,34,.14);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%; scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0; min-height:100%; background:var(--cream); color:var(--ink);
  font-family:"Plus Jakarta Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  -webkit-font-smoothing:antialiased; line-height:1.45; overflow-x:hidden}
h1,h2,h3{font-family:"Baloo 2",system-ui,sans-serif; margin:0; line-height:1.05; font-weight:800; letter-spacing:-.01em}
button{font-family:inherit; cursor:pointer}
.num{font-variant-numeric:tabular-nums}
a{color:var(--red-deep)}

.topbar{position:sticky; top:0; z-index:30; background:var(--maroon); color:#FBEFE0;
  padding:calc(env(safe-area-inset-top,0px) + 11px) 16px 11px; display:flex; align-items:center; gap:12px;
  box-shadow:0 6px 20px rgba(94,22,34,.18)}
.topbar .home{display:flex; flex-direction:column; gap:1px; min-width:0}
.topbar .home b{font-family:"Baloo 2"; font-weight:800; font-size:16px; letter-spacing:.1px; line-height:1}
.topbar .home span{font-size:11px; color:#E5B8A6}
.topbar .right{margin-left:auto; display:flex; align-items:center; gap:8px; flex-shrink:0}
.pill{font-size:12px; padding:5px 11px; border-radius:999px; background:rgba(255,255,255,.13); color:#FBEFE0; white-space:nowrap; font-weight:600; max-width:150px; overflow:hidden; text-overflow:ellipsis}
.pill.role{background:var(--amber); color:#3A1608}
.mode{display:inline-flex; align-items:center; gap:6px; font-size:11px; font-weight:700; padding:4px 9px; border-radius:999px}
.mode.live{background:rgba(31,158,106,.22); color:#BEF0D8}
.mode.demo{background:rgba(247,168,27,.2); color:#FFDDA0}
.mode .d{width:7px; height:7px; border-radius:50%}
.mode.live .d{background:#4ADE9B; animation:beat 1.8s infinite}
.mode.demo .d{background:var(--amber)}
@keyframes beat{0%{box-shadow:0 0 0 0 rgba(74,222,155,.6)}70%{box-shadow:0 0 0 7px rgba(74,222,155,0)}100%{box-shadow:0 0 0 0 rgba(74,222,155,0)}}
.linkbtn{background:none; border:none; color:#E5B8A6; font-size:12px; text-decoration:underline; padding:6px}

.banner{max-width:1000px; margin:10px auto 0; border-radius:12px; padding:11px 15px; font-size:13px; font-weight:600; line-height:1.4}
.banner.r{background:#FDE7E4; color:var(--red-deep)}
.banner.a{background:#FFF3D9; color:#8A5B00}

.wrap{max-width:1000px; margin:0 auto; padding:18px 16px 72px}

.partners{background:#fff; border-radius:16px; box-shadow:var(--shadow); padding:12px 16px;
  display:flex; align-items:center; justify-content:center; gap:clamp(14px,4vw,34px); flex-wrap:wrap}
.partners img{height:36px; width:auto; object-fit:contain; display:block}
.partners .sep{width:1px; height:34px; background:var(--line-strong); flex-shrink:0}
@media(max-width:520px){ .partners img{height:28px} .partners .sep{height:26px} }

.hero{position:relative; min-height:calc(100vh - 20px); display:flex; flex-direction:column; overflow:hidden}
.hero .glow{position:absolute; inset:-30% -10% auto -10%; height:80%; z-index:0; filter:blur(60px); opacity:.6;
  background:radial-gradient(40% 60% at 30% 30%, rgba(247,168,27,.55), transparent 70%),
             radial-gradient(45% 55% at 75% 20%, rgba(238,53,36,.5), transparent 70%),
             radial-gradient(40% 50% at 55% 65%, rgba(31,158,106,.28), transparent 70%);
  animation:drift 14s ease-in-out infinite alternate}
@keyframes drift{0%{transform:translate3d(0,0,0) scale(1)}100%{transform:translate3d(0,-4%,0) scale(1.08)}}
.hero-in{position:relative; z-index:1; flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:26px 14px; gap:16px}
.chefmark{width:132px; height:auto; filter:drop-shadow(0 10px 22px rgba(196,42,28,.28)); animation:pop-spring .7s cubic-bezier(.18,1.3,.5,1) both}
.kicker{color:var(--green-deep); font-weight:800; font-size:13px; letter-spacing:.4px;
  background:var(--green-tint); padding:6px 14px; border-radius:999px; animation:rise .6s .1s both}
.hero h1{font-size:clamp(38px,10vw,74px); color:var(--maroon); animation:rise .6s .16s both}
.hero h1 .em{color:var(--red)}
.hero p{color:var(--ink-soft); max-width:32ch; margin:-4px 0 6px; font-size:15px; animation:rise .6s .24s both}
.roles{display:grid; grid-template-columns:repeat(2,1fr); gap:12px; width:100%; max-width:460px; animation:rise .6s .32s both}
.role{position:relative; background:#fff; border:2px solid transparent; border-radius:20px; padding:18px 14px 16px;
  box-shadow:var(--shadow); display:flex; flex-direction:column; align-items:center; gap:6px; transition:transform .12s, box-shadow .2s; overflow:hidden}
.role::before{content:""; position:absolute; left:0; top:0; height:5px; width:100%; background:var(--amber)}
.role:hover{transform:translateY(-3px); box-shadow:var(--shadow-lg)}
.role:active{transform:scale(.97)}
.role .ic{font-size:28px; line-height:1}
.role b{font-family:"Baloo 2"; font-size:16px; font-weight:800}
.role small{color:var(--ink-soft); font-size:11px}
.role.c0::before{background:var(--red)} .role.c1::before{background:var(--amber)} .role.c2::before{background:var(--green)} .role.c3::before{background:var(--maroon)} .role.c4::before{background:var(--red-deep)}
.role.wide{grid-column:1 / -1}
.role.admin{grid-column:1 / -1; background:var(--maroon); color:#FBEFE0}
.role.admin::before{background:var(--amber)}
.role.admin small{color:#E5B8A6}
.hero-foot{position:relative; z-index:1; padding:0 14px 18px}

.pinwrap{min-height:calc(100vh - 20px); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; text-align:center; padding:20px}
.pinbox{background:#fff; border-radius:22px; box-shadow:var(--shadow-lg); padding:24px; width:100%; max-width:330px; animation:pop-spring .4s cubic-bezier(.2,1.2,.4,1) both}
.pindots{display:flex; gap:13px; justify-content:center; margin:18px 0}
.pindot{width:15px; height:15px; border-radius:50%; border:2px solid var(--line-strong); transition:transform .15s, background .15s, border-color .15s}
.pindot.on{background:var(--red); border-color:var(--red); transform:scale(1.15)}
.pinpad{display:grid; grid-template-columns:repeat(3,1fr); gap:10px}
.pinpad button{aspect-ratio:1.55; border:none; background:var(--cream); border-radius:16px; font-family:"Baloo 2"; font-size:22px; font-weight:700; color:var(--maroon); transition:transform .08s, background .15s}
.pinpad button:active{transform:scale(.92); background:var(--amber-soft)}
.pinpad .alt{background:transparent; color:var(--ink-soft); font-size:20px}
.pinerr{color:var(--red-deep); font-size:13px; min-height:18px; margin-top:12px; font-weight:600}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}

.rhead{display:flex; align-items:center; gap:14px; margin:6px 0 4px}
.rhead .badge{background:var(--red); color:#fff; font-family:"Baloo 2"; font-weight:800; font-size:14px; padding:7px 14px; border-radius:12px; flex-shrink:0; box-shadow:0 6px 14px rgba(238,53,36,.3)}
.rhead .badge.g{background:var(--green); box-shadow:0 6px 14px rgba(31,158,106,.3)}
.rhead h2{font-size:clamp(20px,5vw,27px); color:var(--maroon); line-height:1.02}
.rhead .meta{margin-left:auto; font-size:12px; color:var(--ink-soft); font-weight:600; flex-shrink:0}
.sub{color:var(--ink-soft); font-size:13.5px; margin:2px 0 16px}
.notice{border-radius:14px; padding:12px 15px; font-size:13.5px; margin:14px 0; font-weight:500}
.notice.g{background:var(--green-tint); color:var(--green-deep)}
.notice.a{background:#FFF3D9; color:#8A5B00}

.chips{display:grid; grid-template-columns:repeat(auto-fill,minmax(146px,1fr)); gap:11px; margin-top:6px}
.chip{position:relative; background:#fff; border:2px solid var(--line); border-radius:18px; padding:15px; text-align:left;
  display:flex; flex-direction:column; gap:5px; box-shadow:var(--shadow); transition:transform .12s, border-color .18s, box-shadow .2s}
.chip:hover{transform:translateY(-2px); box-shadow:var(--shadow-lg)}
.chip:active{transform:scale(.98)}
.chip.done{border-color:var(--green)}
.chip .tn{font-family:"Baloo 2"; font-size:21px; font-weight:800; color:var(--maroon)}
.chip .rowb{display:flex; align-items:center; gap:7px; font-size:12.5px; color:var(--ink-soft); font-weight:600}
.chip.done .rowb{color:var(--green-deep)}
.dot{width:9px; height:9px; border-radius:50%; background:var(--line-strong)}
.chip.done .dot{background:var(--green)}
.chip .tick{position:absolute; top:12px; right:12px; width:22px; height:22px; border-radius:50%; background:var(--green); color:#fff; display:none; align-items:center; justify-content:center; font-size:13px; animation:pop-spring .35s cubic-bezier(.2,1.4,.4,1) both}
.chip.done .tick{display:flex}

.backlink{background:none; border:none; color:var(--red-deep); font-weight:700; font-size:14px; padding:8px 0; display:inline-flex; gap:6px; align-items:center}
.ticket{background:#fff; border-radius:22px; box-shadow:var(--shadow-lg); overflow:hidden; margin-top:6px; animation:rise .35s both}
.ticket-top{background:var(--maroon); color:#FBEFE0; padding:17px 20px; display:flex; align-items:center; gap:14px}
.ticket-top .no{font-family:"Baloo 2"; font-size:34px; font-weight:800; line-height:1}
.ticket-top .info{display:flex; flex-direction:column; gap:2px}
.ticket-top .info b{font-family:"Baloo 2"; font-size:18px}
.ticket-top .info span{font-size:12px; color:#E5B8A6}
.ticket-body{padding:4px 18px}
.crow{display:flex; align-items:center; gap:14px; padding:15px 2px; border-bottom:1px dashed var(--line-strong)}
.crow:last-child{border-bottom:none}
.crow .lab{flex:1; min-width:0}
.crow .lab b{font-weight:700; font-size:15px; display:block; color:var(--ink)}
.crow .lab small{color:var(--ink-soft); font-size:11px}
.crow.hero-cat .lab b{color:var(--red-deep)}
.stepper{display:flex; align-items:center; flex-shrink:0; background:var(--cream); border-radius:14px; padding:4px}
.stepper button{width:40px; height:40px; border:none; background:#fff; border-radius:10px; font-family:"Baloo 2"; font-size:22px; font-weight:800; color:var(--red); box-shadow:0 1px 3px rgba(94,22,34,.12); transition:transform .08s}
.stepper button:active{transform:scale(.86)}
.stepper button.mn{color:var(--maroon)}
.stepper .val{width:54px; text-align:center; font-family:"Baloo 2"; font-size:24px; font-weight:800; color:var(--maroon); border:none; background:transparent; -moz-appearance:textfield}
.stepper .val::-webkit-outer-spin-button,.stepper .val::-webkit-inner-spin-button{-webkit-appearance:none; margin:0}
.stepper .val.pop{animation:pop-val .3s cubic-bezier(.2,1.5,.4,1)}
.stepper .val::placeholder{color:var(--line-strong); font-weight:700}
.stepper.invalid{outline:2px solid var(--red); outline-offset:2px; border-radius:16px}
@keyframes pop-val{0%{transform:scale(1)}45%{transform:scale(1.35)}100%{transform:scale(1)}}
.ticket-foot{padding:15px 20px calc(env(safe-area-inset-bottom,0px) + 16px); display:flex; align-items:center; gap:14px; background:var(--cream); border-top:2px dashed var(--line-strong)}
.subtot{font-size:13px; color:var(--ink-soft); font-weight:600}
.subtot b{font-family:"Baloo 2"; font-size:32px; color:var(--maroon); margin-right:3px; display:inline-block}
.grow{margin-left:auto}

.btn{border:none; border-radius:14px; padding:14px 20px; font-size:15px; font-weight:700; transition:transform .1s, filter .15s; font-family:inherit}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--red); color:#fff; box-shadow:0 8px 18px rgba(238,53,36,.28)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.gold{background:var(--amber); color:#3A1608; box-shadow:0 8px 18px rgba(247,168,27,.3)}
.btn.green{background:var(--green); color:#fff; box-shadow:0 8px 18px rgba(31,158,106,.28)}
.btn.ghost{background:#fff; border:2px solid var(--line-strong); color:var(--ink)}
.btn.danger{background:#fff; border:2px solid var(--red); color:var(--red-deep)}
.btn.block{width:100%}
.btn:disabled{opacity:.5; transform:none}

.tabs{display:flex; gap:5px; background:#fff; border-radius:16px; padding:5px; box-shadow:var(--shadow); margin-bottom:14px; overflow-x:auto}
.tabs button{flex:1; white-space:nowrap; border:none; background:none; padding:11px 14px; border-radius:11px; font-size:13.5px; font-weight:700; color:var(--ink-soft); transition:background .15s, color .15s}
.tabs button.on{background:var(--maroon); color:#FBEFE0}
.stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:11px; margin:4px 0 16px}
.stat{background:#fff; border-radius:16px; padding:15px 16px; box-shadow:var(--shadow); border-left:5px solid var(--amber)}
.stat.r{border-left-color:var(--red)} .stat.g{border-left-color:var(--green)}
.stat b{font-family:"Baloo 2"; font-size:30px; display:block; color:var(--maroon); line-height:1}
.stat small{color:var(--ink-soft); font-size:12px; font-weight:600}

.lb{display:flex; flex-direction:column; gap:9px; position:relative}
.lbrow{display:flex; align-items:center; gap:13px; background:#fff; border-radius:16px; padding:13px 15px; box-shadow:var(--shadow);
  border:2px solid transparent; will-change:transform}
.lbrow .rk{font-family:"Baloo 2"; font-size:20px; font-weight:800; color:var(--ink-soft); width:30px; text-align:center; flex-shrink:0}
.lbrow .team{font-family:"Baloo 2"; font-size:18px; font-weight:800; color:var(--maroon); flex-shrink:0; min-width:78px}
.lbrow .jchips{display:flex; gap:6px; flex-wrap:wrap; flex:1}
.jchip{font-size:12px; font-weight:700; padding:4px 9px; border-radius:9px; background:var(--cream); color:var(--ink-soft); font-variant-numeric:tabular-nums}
.jchip.has{background:var(--green-tint); color:var(--green-deep)}
.lbrow .tot{font-family:"Baloo 2"; font-size:26px; font-weight:800; color:var(--maroon); margin-left:auto; flex-shrink:0; font-variant-numeric:tabular-nums}
.lbrow.adv{border-color:var(--green)}
.lbrow.top1{background:linear-gradient(100deg,#FFF6E9,#FFEFC9); border-color:var(--amber)}
.lbrow.top1 .rk, .lbrow.top2 .rk, .lbrow.top3 .rk{color:var(--maroon)}
.lbrow.flash{animation:flashrow 1.1s}
@keyframes flashrow{0%{box-shadow:0 0 0 3px rgba(247,168,27,.6), var(--shadow)}100%{box-shadow:var(--shadow)}}
.medal{font-size:20px; width:30px; text-align:center; flex-shrink:0}

.tablewrap{overflow-x:auto; border-radius:16px; box-shadow:var(--shadow); background:#fff}
table{border-collapse:collapse; width:100%; font-size:13.5px}
th,td{padding:11px 13px; text-align:center; white-space:nowrap; border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left; position:sticky; left:0; background:#fff; font-weight:700}
thead th{background:var(--cream); font-weight:700; color:var(--maroon); font-size:12px; position:sticky; top:0}
tbody tr:last-child td{border-bottom:none}
.mk{font-size:16px; font-weight:800}
.mk.ok{color:var(--green)} .mk.no{color:var(--line-strong)}

.podium{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; align-items:end; margin:10px 0 6px}
.plate{background:#fff; border-radius:20px; box-shadow:var(--shadow-lg); padding:18px 12px; text-align:center; border:2px solid var(--line)}
.plate.p1{border-color:var(--amber); background:linear-gradient(180deg,#FFFDF6,#FFF1CE); order:2}
.plate.p2{order:1} .plate.p3{order:3}
.plate .m{font-size:38px; line-height:1}
.plate .t{font-family:"Baloo 2"; font-size:24px; font-weight:800; color:var(--maroon); margin-top:4px}
.plate .pts{font-family:"Baloo 2"; font-size:20px; color:var(--red-deep); font-variant-numeric:tabular-nums}
.plate .cap{color:var(--ink-soft); font-size:11.5px; font-weight:700; margin-top:4px}
.plate.reveal{animation:podium-in .55s cubic-bezier(.2,1.3,.4,1) both}
@keyframes podium-in{0%{opacity:0; transform:translateY(26px) scale(.9)}100%{opacity:1; transform:none}}

.setup{background:#fff; border-radius:16px; box-shadow:var(--shadow); padding:18px; margin-bottom:16px}
.setup .grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:14px}
.setup label{display:block; font-size:12px; color:var(--ink-soft); font-weight:700; margin-bottom:5px}
.setup input{width:100%; padding:11px 13px; border:2px solid var(--line-strong); border-radius:12px; font-size:15px; font-family:inherit; background:var(--cream)}
.setup input:focus{outline:none; border-color:var(--amber)}
.jrow{display:flex; gap:10px; align-items:flex-end; margin-bottom:10px}
.jrow .nm{flex:1} .jrow .pn{width:96px}
.actions{display:flex; flex-wrap:wrap; gap:10px; margin:16px 0}

.center{display:flex; flex-direction:column; align-items:center; gap:14px; padding:52px 16px; text-align:center; color:var(--ink-soft)}
.center .big{font-size:52px}
.center b{color:var(--ink)}

.toast{position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(20px); z-index:90; opacity:0;
  background:var(--maroon); color:#FBEFE0; padding:13px 20px; border-radius:14px; font-weight:600; font-size:14px; box-shadow:var(--shadow-lg); transition:opacity .25s, transform .25s; max-width:90vw; text-align:center}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0)}

.modal-bg{position:fixed; inset:0; background:rgba(42,19,15,.5); z-index:85; display:flex; align-items:center; justify-content:center; padding:16px; animation:fade .2s}
.modal{background:#fff; border-radius:20px; box-shadow:var(--shadow-lg); max-width:460px; width:100%; max-height:85vh; display:flex; flex-direction:column; overflow:hidden}
.modal h3{padding:18px 20px 2px; color:var(--maroon); font-size:20px}
.modal .msub{padding:0 20px; color:var(--ink-soft); font-size:12.5px}
.modal .mbody{padding:10px 20px; overflow:auto}
.modal .mfoot{padding:14px 20px; border-top:1px solid var(--line); display:flex; gap:10px; justify-content:flex-end}
.chkrow{display:flex; align-items:center; gap:12px; padding:11px 4px; border-bottom:1px solid var(--line)}
.chkrow:last-child{border-bottom:none}
.chkrow input{width:20px; height:20px; accent-color:var(--green); flex-shrink:0}
.chkrow .rk{width:30px; color:var(--ink-soft); font-weight:700; font-family:"Baloo 2"}
.chkrow .nm{font-weight:700; color:var(--maroon)}
.chkrow.cut{border-bottom:2px dashed var(--amber)}
.chkrow .tt{margin-left:auto; font-variant-numeric:tabular-nums; font-weight:700}
@keyframes fade{from{opacity:0}to{opacity:1}}

#confetti{position:fixed; inset:0; pointer-events:none; z-index:80}

@keyframes pop-spring{0%{opacity:0; transform:scale(.82)}60%{transform:scale(1.04)}100%{opacity:1; transform:scale(1)}}
@keyframes rise{0%{opacity:0; transform:translateY(14px)}100%{opacity:1; transform:none}}
@media(prefers-reduced-motion:reduce){
  *{animation-duration:.001s !important; animation-iteration-count:1 !important; transition-duration:.001s !important}
}
</style>
</head>

<canvas id="confetti"></canvas>
<div id="app"></div>
<div class="toast" id="toast"></div>

function $(s,r){return (r||document).querySelector(s);}
function el(h){var t=document.createElement("template"); t.innerHTML=h.trim(); return t.content.firstChild;}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];});}
function fmt(n){ if(n==null||n==="") return "\u2013"; return String(Math.round(Number(n)*10)/10); }
function clamp(n){ n=parseFloat(n); if(isNaN(n))n=0; return Math.max(0,Math.min(MAX,Math.round(n*10)/10)); }
function sid(r,j,t){ return "r"+r+"_j"+j+"_t"+t; }
function reduced(){ return window.matchMedia && matchMedia("(prefers-reduced-motion:reduce)").matches; }
function loadSession(){ try{return JSON.parse(localStorage.getItem("sc_sess")||"null")||{role:null,judge:null};}catch(e){return {role:null,judge:null};} }
function saveSession(){ try{localStorage.setItem("sc_sess",JSON.stringify(session));}catch(e){} }
function toast(m){ var t=$("#toast"); t.textContent=m; t.classList.add("show"); clearTimeout(t._t); t._t=setTimeout(function(){t.classList.remove("show");},2200); }
function catTotal(cat,round){ var s=0; CATS[round].forEach(function(c){ s+=Number((cat&&cat[c[0]])||0); }); return s; }
function teamsFor(r){ if(!CONFIG)return []; if(r===1){var a=[];for(var i=1;i<=CONFIG.r1_teams;i++)a.push(i);return a;} return (CONFIG.finalists||[]).slice().sort(function(a,b){return a-b;}); }
function judgeName(n){ return (CONFIG && CONFIG.judge_names && CONFIG.judge_names[String(n)]) || ("Judge "+n); }
function numJudges(){ return CONFIG ? CONFIG.num_judges : 5; }
function getCreds(){ var u=SUPABASE_URL, k=SUPABASE_ANON_KEY;
  try{ u=u||localStorage.getItem("sc_url")||""; k=k||localStorage.getItem("sc_key")||""; }catch(e){}
  u=(u||"").trim().replace(/\/rest\/v1\/?$/,"").replace(/\/+$/,""); // tolerate a pasted /rest/v1
  return {url:u, key:(k||"").trim()}; }

/* ---------- STORES ---------- */
function makeStore(){ var c=getCreds();
  if(c.url && c.key){
    if(!window.supabase){ CONN={level:"error", msg:"Supabase keys are set, but the Supabase library didn't load. This page needs internet access once to fetch it from the CDN \u2014 check the connection/firewall on this device and reload."}; return new DemoStore(); }
    try{ return new SupabaseStore(c.url,c.key); }catch(e){ CONN={level:"error", msg:"Couldn't start Supabase: "+((e&&e.message)||e)}; return new DemoStore(); }
  }
  CONN={level:"demo", msg:"No Supabase URL/key found in this file \u2014 running in demo mode. Add them near the top of the HTML (or in Organiser \u25b8 Setup) and reload to go live."};
  return new DemoStore(); }

function SupabaseStore(url,key){ this.mode="live"; this.sb=window.supabase.createClient(url,key); }
SupabaseStore.prototype.norm=function(row){ var c=Object.assign({},DEFAULT_CONFIG,row||{});
  c.pins=Object.assign({},DEFAULT_CONFIG.pins,(row&&row.pins)||{});
  c.judge_names=Object.assign({},DEFAULT_CONFIG.judge_names,(row&&row.judge_names)||{});
  c.finalists=(row&&row.finalists)||[]; return c; };
SupabaseStore.prototype.loadConfig=async function(){
  var r=await this.sb.from("sc_config").select("*").eq("id",1).maybeSingle();
  if(r.error){ return this.norm(DEFAULT_CONFIG); }
  if(!r.data){ try{ await this.sb.from("sc_config").upsert(Object.assign({id:1},DEFAULT_CONFIG)); }catch(e){} return this.norm(DEFAULT_CONFIG); }
  return this.norm(r.data); };
SupabaseStore.prototype.health=async function(){ try{ var r=await this.sb.from("sc_config").select("id").limit(1); if(r.error)return {ok:false,msg:r.error.message}; return {ok:true}; }catch(e){ return {ok:false,msg:(e&&e.message)||String(e)}; } };

function standings(round){ var teams=teamsFor(round), n=numJudges();
  var rows=teams.map(function(t){ var jt={},sum=0,c=0; for(var j=1;j<=n;j++){ var d=ALL[sid(round,j,t)]; if(d){jt[j]=Number(d.total);sum+=Number(d.total);c++;}else jt[j]=null; } return {team:t,jt:jt,total:sum,n:c}; });
  rows.sort(function(a,b){ return b.total-a.total || a.team-b.team; }); return rows; }
function combined(){ var teams=teamsFor(2), n=numJudges();
  var rows=teams.map(function(t){ var r1=0,r2=0; for(var j=1;j<=n;j++){ var a=ALL[sid(1,j,t)]; if(a)r1+=Number(a.total); var b=ALL[sid(2,j,t)]; if(b)r2+=Number(b.total); } return {team:t,r1:r1,r2:r2,total:r1+r2}; });
  rows.sort(function(a,b){ return b.total-a.total || b.r2-a.r2 || a.team-b.team; }); return rows; } // tie -> higher Round 2 wins
function autoFinalists(rows,cut){ if(rows.length<=cut) return rows.map(function(r){return r.team;});
  var cutScore=rows[cut-1].total; return rows.filter(function(r){return r.total>=cutScore;}).map(function(r){return r.team;}); } // ties at cutoff all advance

function updateLeaderboard(instant){ var lb=$("#lb"); if(!lb)return; var round=CONFIG.active_round, rows=standings(round), cut=CONFIG.r2_teams, n=numJudges();

    if(!card){ card=el('<div class="lbrow"></div>'); card._prev=0; lbCards[r.team]=card; lb.appendChild(card); }

    card.className="lbrow"+(round===1 && advSet[r.team]?" adv":"")+((round===2&&i<3)?" top"+(i+1):"");
    var jchips=""; for(var j=1;j<=n;j++){ var v=r.jt[j]; jchips+='<span class="jchip'+(v!=null?" has":"")+'" title="'+esc(judgeName(j))+'">J'+j+' '+(v!=null?fmt(v):"\u00b7")+'</span>'; }
    card.innerHTML=(medal?'<span class="medal">'+medal+'</span>':'<span class="rk">'+(i+1)+'</span>')
      +'<span class="team">Team '+r.team+'</span><span class="jchips">'+jchips+'</span>'
      +'<span class="tot">'+fmt(card._prev||0)+'</span>';
    order.push(card);
    animateNum(card.querySelector(".tot"), card._prev||0, r.total, instant);
    if(!instant && (card._prev||0)!==r.total){ card.classList.remove("flash"); void card.offsetWidth; card.classList.add("flash"); }
    card._prev=r.total; });
  Object.keys(lbCards).forEach(function(tm){ if(rows.findIndex(function(r){return String(r.team)===String(tm);})<0){ lb.removeChild(lbCards[tm]); delete lbCards[tm]; } });
  order.forEach(function(c){ lb.appendChild(c); });
  if(rows.length===0) lb.appendChild(el('<div class="center" style="padding:36px"><div class="big">\ud83c\udf7d\ufe0f</div><div>No scores yet. They\'ll appear the moment judges submit.</div></div>'));
  if(!instant && !reduced()){ Object.keys(lbCards).forEach(function(tm){ var c=lbCards[tm]; if(first[tm]==null)return;
    var d=first[tm]-c.getBoundingClientRect().top; if(!d)return; c.style.transition="none"; c.style.transform="translateY("+d+"px)";
    requestAnimationFrame(function(){ c.style.transition="transform .5s cubic-bezier(.2,.8,.2,1)"; c.style.transform=""; }); }); } }
function animateNum(elm,from,to,instant){ if(!elm)return; from=Number(from)||0; to=Number(to)||0;
  if(instant||reduced()||from===to){ elm.textContent=fmt(to); return; }
  var t0=performance.now(), dur=550;
  function step(t){ var k=Math.min(1,(t-t0)/dur); k=1-Math.pow(1-k,3); elm.textContent=fmt(from+(to-from)*k); if(k<1)requestAnimationFrame(step); }
  requestAnimationFrame(step); }

/* ---- finalists editor (tie override) ---- */
function openFinalistsEditor(){ var rows=standings(1), cut=CONFIG.r2_teams;
  var sel={}; (CONFIG.finalists||[]).forEach(function(t){sel[t]=1;});
  var bg=el('<div class="modal-bg"></div>');
  var m=el('<div class="modal"></div>');
  m.appendChild(el('<h3>Edit finalists</h3>'));
  m.appendChild(el('<div class="msub">Tick the teams that advance to Round 2. Teams tied at the cut-off are pre-selected; adjust as you wish. The dashed line marks the Top '+cut+' boundary.</div>'));
  var mb=el('<div class="mbody"></div>');
  rows.forEach(function(r,i){ var row=el('<label class="chkrow'+((i+1)===cut?" cut":"")+'"></label>');
    var cb=el('<input type="checkbox">'); cb.checked=!!sel[r.team]; cb.dataset.team=r.team;
    row.appendChild(cb);
    row.appendChild(el('<span class="rk">#'+(i+1)+'</span>'));
    row.appendChild(el('<span class="nm">Team '+r.team+'</span>'));
    row.appendChild(el('<span class="tt">'+fmt(r.total)+'</span>'));
    mb.appendChild(row); });
  m.appendChild(mb);
  var foot=el('<div class="mfoot"></div>');
  var cancel=el('<button class="btn ghost">Cancel</button>'); cancel.onclick=function(){ document.body.removeChild(bg); };
  var save=el('<button class="btn green">Save finalists</button>');
  save.onclick=async function(){ var chosen=[]; mb.querySelectorAll("input[type=checkbox]").forEach(function(cb){ if(cb.checked) chosen.push(Number(cb.dataset.team)); });
    if(chosen.length===0){ toast("Pick at least one team"); return; }
    chosen.sort(function(a,b){return a-b;});
    try{ await store.updateConfig({finalists:chosen, r1_locked:true}); toast(chosen.length+" finalists saved"); document.body.removeChild(bg); }catch(e){ toast("Couldn't save: "+((e&&e.message)||"error")); } };
  foot.appendChild(cancel); foot.appendChild(save); m.appendChild(foot);
  bg.appendChild(m); bg.onclick=function(e){ if(e.target===bg) document.body.removeChild(bg); };
  document.body.appendChild(bg); }

function mountProgress(body){ body.innerHTML="";
  body.appendChild(el('<div class="stats" id="progcards"></div>'));
  body.appendChild(el('<div class="notice g">Each card shows how many teams that judge has finished. \u2713 in the table = that judge has scored that team.</div>'));
  body.appendChild(el('<div class="tablewrap" id="prog"></div>')); updateProgress(); }
function updateProgress(){ var round=CONFIG.active_round, teams=teamsFor(round), n=numJudges();
  var cards=$("#progcards");
  if(cards){ cards.innerHTML=""; for(var jj=1;jj<=n;jj++){ (function(j){ var done=0; teams.forEach(function(t){ if(ALL[sid(round,j,t)])done++; });
    var full=(done===teams.length && teams.length>0);
    cards.appendChild(el('<div class="stat '+(full?"g":"r")+'"><b class="num">'+done+'/'+teams.length+'</b><small>'+esc(judgeName(j))+(full?" \u2713":"")+'</small></div>')); })(jj); } }
  var host=$("#prog"); if(!host)return;
  var h="<table><thead><tr><th>Team</th>"; for(var j=1;j<=n;j++)h+="<th>"+esc(judgeName(j))+"</th>"; h+="</tr></thead><tbody>";
  teams.forEach(function(t){ h+="<tr><td>Team "+t+"</td>"; for(var j=1;j<=n;j++){ var has=!!ALL[sid(round,j,t)]; h+='<td><span class="mk '+(has?"ok":"no")+'">'+(has?"\u2713":"\u00b7")+'</span></td>'; } h+="</tr>"; });
  h+="</tbody></table>"; host.innerHTML=h; }

function mountFinal(body){ body.innerHTML="";
  if(!CONFIG.r1_locked || (CONFIG.finalists||[]).length===0){ body.appendChild(el('<div class="center"><div class="big">\ud83c\udfc1</div><div><b>Final results unlock after Round 1 is locked and Round 2 is scored.</b></div></div>')); return; }
  body.appendChild(el('<div class="rhead"><span class="badge g">Final</span><h2>Podium</h2><span class="meta">Round 1 + Round 2</span></div>'));
  body.appendChild(el('<div class="podium" id="podium"></div>'));
  body.appendChild(el('<div class="notice g" style="margin-top:14px">Ranked by grand total (Round 1 + Round 2). If two teams tie, the one with the higher Round 2 score is placed above.</div>'));
  body.appendChild(el('<div class="rhead" style="margin-top:8px"><h2>Combined standings</h2></div>'));
  body.appendChild(el('<div class="tablewrap" id="ftable"></div>'));
  var ex=el('<div class="actions"><button class="btn gold">\u2b07 Export full results (CSV)</button></div>'); ex.firstChild.onclick=exportAll; body.appendChild(ex);
  updateFinal(true); }
var lastWinner=null;
function updateFinal(first){ var pod=$("#podium"); if(!pod)return; var rows=combined(), medals=["\ud83e\udd47","\ud83e\udd48","\ud83e\udd49"], caps=["Winner","1st Runner-up","2nd Runner-up"], n=numJudges();
  pod.innerHTML="";
  [0,1,2].forEach(function(i){ var r=rows[i]; var p=el('<div class="plate p'+(i+1)+(first?" reveal":"")+'"></div>');
    if(first) p.style.animationDelay=(0.12*(2-i))+"s";
    p.innerHTML='<div class="m">'+(r?medals[i]:"\u00b7")+'</div><div class="t">'+(r?"Team "+r.team:"\u2014")+'</div><div class="pts num">'+(r?fmt(r.total):"\u2013")+' / '+(n*120)+'</div><div class="cap">'+caps[i]+'</div>';
    pod.appendChild(p); });
  var ft=$("#ftable");
  var h='<table><thead><tr><th>Rank / Team</th><th>Round 1</th><th>Round 2</th><th>Grand /'+(n*120)+'</th></tr></thead><tbody>';
  rows.forEach(function(r,i){ var m=i<3?medals[i]+" ":""; h+='<tr><td style="text-align:left">'+m+"#"+(i+1)+"  Team "+r.team+'</td><td>'+fmt(r.r1)+'</td><td>'+fmt(r.r2)+'</td><td style="font-weight:800;color:var(--maroon)">'+fmt(r.total)+'</td></tr>'; });
  h+="</tbody></table>"; ft.innerHTML=h;
  var win=rows[0]?rows[0].team:null;
  if(win!=null && subCount(2).done>0 && (first || win!==lastWinner)){ lastWinner=win; fireConfetti(); } }

function mountSetup(body){ body.innerHTML="";
  var s=el('<div class="setup"></div>');
  s.innerHTML='<div class="rhead"><h2 style="font-size:20px">Event settings</h2></div>'
   +'<div class="grid" style="margin-top:12px">'
   +'<div><label>Teams in Round 1</label><input id="s_r1" type="number" value="'+CONFIG.r1_teams+'"></div>'
   +'<div><label>Finalists target (Round 2)</label><input id="s_r2" type="number" value="'+CONFIG.r2_teams+'"></div>'
   +'<div><label>Number of judges (max 5)</label><input id="s_nj" type="number" min="1" max="5" value="'+CONFIG.num_judges+'"></div></div>'
   +'<div><label>Organiser PIN</label><input id="s_pa" value="'+esc(CONFIG.pins.admin)+'" style="max-width:160px"></div>';
  body.appendChild(s);

  var jd2=el('<div class="setup"></div>');
  jd2.appendChild(el('<div class="rhead"><h2 style="font-size:20px">Judges (name + PIN)</h2></div>'));
  jd2.appendChild(el('<div class="msub" style="padding:0;color:var(--ink-soft);font-size:12.5px;margin:6px 0 12px">Give each judge a name (shown on their device and in the results). Only the first “Number of judges” above will appear on the login screen.</div>'));
  for(var i=1;i<=MAXJUDGES;i++){
    var row=el('<div class="jrow"></div>');
    row.appendChild(el('<div class="nm"><label>Judge '+i+' name</label><input id="s_n'+i+'" value="'+esc(judgeName(i))+'"></div>'));
    row.appendChild(el('<div class="pn"><label>PIN</label><input id="s_p'+i+'" value="'+esc(CONFIG.pins["j"+i]||"")+'"></div>'));
    jd2.appendChild(row);
  }
  body.appendChild(jd2);

  var save=el('<div class="actions"><button class="btn primary">Save settings</button></div>');
  save.firstChild.onclick=async function(){
    var pins={admin:$("#s_pa").value||"9999"}, names={};
    for(var i=1;i<=MAXJUDGES;i++){ pins["j"+i]=$("#s_p"+i).value||String(i)+String(i)+String(i)+String(i); names[String(i)]=($("#s_n"+i).value||("Judge "+i)).trim(); }
    var patch={ r1_teams:Math.max(1,parseInt($("#s_r1").value)||CONFIG.r1_teams),
      r2_teams:Math.max(1,parseInt($("#s_r2").value)||CONFIG.r2_teams),
      num_judges:Math.min(MAXJUDGES,Math.max(1,parseInt($("#s_nj").value)||CONFIG.num_judges)),
      pins:pins, judge_names:names };
    try{ await store.updateConfig(patch); toast("Settings saved"); }catch(e){ toast("Couldn't save: "+((e&&e.message)||"error")+" (did you re-run the setup SQL?)"); } };
  body.appendChild(save);

  var c=getCreds();
  var conn=el('<div class="setup"></div>');
  conn.innerHTML='<div class="rhead"><h2 style="font-size:20px">Live sync (Supabase)</h2></div>'
    +'<p class="sub" style="margin-top:8px">Status: <b>'+(store.mode==="live"?"\u25cf Connected \u2014 live sync on":"\u25d0 Demo mode \u2014 no sync")+'</b>. Best practice is to paste keys straight into the HTML file (works on every device). Pasting here only affects THIS device.</p>'
    +'<div class="grid"><div style="grid-column:1/-1"><label>Supabase URL</label><input id="c_url" value="'+esc(c.url)+'" placeholder="https://xxxx.supabase.co"></div>'
    +'<div style="grid-column:1/-1"><label>Anon public key</label><input id="c_key" value="'+esc(c.key)+'" placeholder="eyJ..."></div></div>';
  body.appendChild(conn);
  var cb=el('<div class="actions"><button class="btn green">Save & reload</button></div>');
  cb.firstChild.onclick=function(){ try{ localStorage.setItem("sc_url",$("#c_url").value.trim()); localStorage.setItem("sc_key",$("#c_key").value.trim()); }catch(e){} location.reload(); };
  body.appendChild(cb);

  var dz=el('<div class="setup"></div>');
  dz.appendChild(el('<div class="rhead"><h2 style="font-size:20px;color:var(--red-deep)">Danger zone</h2></div>'));
  var db=el('<div class="actions" style="margin-bottom:0"><button class="btn danger">Clear ALL scores & reopen Round 1</button></div>');
  db.firstChild.onclick=async function(){ if(!confirm("Delete every score from both rounds and reopen Round 1? This cannot be undone."))return;
    try{ await store.clearScores(); await store.updateConfig({active_round:1,r1_locked:false,finalists:[]}); ALL={}; toast("All scores cleared"); }catch(e){ toast("Couldn't clear"); } };
  dz.appendChild(db); body.appendChild(dz); }

async function lockRound1(){ var rows=standings(1), cut=CONFIG.r2_teams, fin=autoFinalists(rows,cut), extra=fin.length-cut;
  var c=subCount(1);
  var msg;
  if(extra>0){ msg="There's a tie at the cut-off, so "+fin.length+" teams will advance to Round 2 (instead of "+cut+"). All tied teams are kept; you can fine-tune who advances with \u201cEdit finalists\u201d afterwards.\n\nLock Round 1 now?"; }
  else { msg="Lock Round 1 and send the Top "+cut+" through to Round 2?"; }
  if(c.done<c.tot){ msg="Only "+c.done+" of "+c.tot+" Round 1 scores are in.\n\n"+msg; }
  if(!confirm(msg)) return;
  try{ await store.updateConfig({r1_locked:true, finalists:fin, active_round:2}); toast("Round 1 locked \u00b7 "+fin.length+" teams advance"); }catch(e){ toast("Couldn't lock: "+((e&&e.message)||"error")); } }

function simulate(){ var round=CONFIG.active_round, teams=teamsFor(round), n=numJudges(), i=0, jobs=[];
  teams.forEach(function(t){ for(var j=1;j<=n;j++) jobs.push([t,j]); });
  jobs.sort(function(){return Math.random()-.5;});
  (function tick(){ if(i>=jobs.length)return; var t=jobs[i][0], j=jobs[i][1]; i++;
    var row={id:sid(round,j,t),round:round,judge:j,team:t,total:0,updated_at:new Date().toISOString()}, tot=0;
    CATKEYS.forEach(function(k){ var v=Math.round((5+Math.random()*5)*2)/2; row["c_"+k]=v; tot+=v; }); row.total=tot;
    store.saveScore(row); setTimeout(tick,120); })(); }

function dl(name,text){ try{ var b=new Blob([text],{type:"text/csv"}); var u=URL.createObjectURL(b); var a=document.createElement("a"); a.href=u; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(function(){URL.revokeObjectURL(u);},1000); }catch(e){ toast("Export needs the hosted page"); } }
function cc(v){ v=(v==null?"":String(v)); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }
function exportRound(round){ var n=numJudges(), head=["Round","Team","Judge"].concat(CATS[round].map(function(c){return c[1];})).concat(["Judge total /60"]);
  var lines=[head.map(cc).join(",")];
  teamsFor(round).forEach(function(t){ for(var j=1;j<=n;j++){ var d=ALL[sid(round,j,t)]; var r=[round,"Team "+t,judgeName(j)];
    CATS[round].forEach(function(c){ r.push(d?fmt(d["c_"+c[0]]):""); }); r.push(d?fmt(d.total):""); lines.push(r.map(cc).join(",")); } });
  dl("SuperChef_Round"+round+"_scores.csv", lines.join("\n")); }
function exportAll(){ var n=numJudges(), lines=[];
  [1,2].forEach(function(round){ var head=["Round","Team","Judge"].concat(CATS[round].map(function(c){return c[1];})).concat(["Judge total /60"]);
    lines.push(head.map(cc).join(","));
    teamsFor(round).forEach(function(t){ for(var j=1;j<=n;j++){ var d=ALL[sid(round,j,t)]; var r=[round,"Team "+t,judgeName(j)];
      CATS[round].forEach(function(c){ r.push(d?fmt(d["c_"+c[0]]):""); }); r.push(d?fmt(d.total):""); lines.push(r.map(cc).join(",")); } });
    lines.push(""); });
  lines.push("FINAL STANDINGS");
  lines.push(["Rank","Team","Round 1 /"+(n*60),"Round 2 /"+(n*60),"Grand /"+(n*120)].map(cc).join(","));
  combined().forEach(function(r,i){ lines.push([i+1,"Team "+r.team,fmt(r.r1),fmt(r.r2),fmt(r.total)].map(cc).join(",")); });
  dl("SuperChef_full_results.csv", lines.join("\n")); }

function fireConfetti(){ if(reduced())return; var cv=$("#confetti"), ctx=cv.getContext("2d");
  cv.width=innerWidth; cv.height=innerHeight; var cols=["#EE3524","#F7A81B","#1F9E6A","#FFCF6B","#5E1622"], P=[];
  for(var i=0;i<160;i++) P.push({x:innerWidth/2+(Math.random()-.5)*160, y:innerHeight*0.32, vx:(Math.random()-.5)*11, vy:-6-Math.random()*11, g:0.28+Math.random()*0.12, s:5+Math.random()*7, c:cols[i%cols.length], r:Math.random()*6, vr:(Math.random()-.5)*0.4, a:1});
  var t0=performance.now();
  (function anim(t){ ctx.clearRect(0,0,cv.width,cv.height); var alive=false;
    P.forEach(function(p){ p.vy+=p.g; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr; if(t-t0>1600)p.a-=0.03; if(p.a>0&&p.y<cv.height+40){alive=true;
      ctx.save(); ctx.globalAlpha=Math.max(0,p.a); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.fillStyle=p.c; ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*0.6); ctx.restore(); } });
    if(alive)requestAnimationFrame(anim); else ctx.clearRect(0,0,cv.width,cv.height); })(t0); }

})();
</script>
